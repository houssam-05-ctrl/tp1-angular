<div class="flex min-h-dvh flex-col">
  <header
    class="sticky top-0 z-10 flex flex-wrap items-center gap-4 bg-[var(--mat-sys-primary)] px-4 py-3 text-[var(--mat-sys-on-primary)] shadow-md"
  >
    <span class="text-lg font-semibold">{{ title() }}</span>

    <nav class="flex w-full flex-wrap gap-1 sm:ml-auto sm:w-auto" aria-label="Choix de l'exercice">
      <a
        routerLink="/template-driven"
        routerLinkActive="bg-white/20"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-md px-3 py-2 text-sm font-medium transition-colors hover:bg-white/10"
      >
        Exercice 1 · Template-Driven
      </a>
      <a
        routerLink="/reactive"
        routerLinkActive="bg-white/20"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-md px-3 py-2 text-sm font-medium transition-colors hover:bg-white/10"
      >
        Exercice 2 · Reactive Forms
      </a>
    </nav>
  </header>

  <main class="flex-1 px-4 pt-8 pb-12">
    <router-outlet />
  </main>
</div>
